            dependencies:
              - locationName: EXEC_COMBINED_DATA
                nodeName: V_EMPLOYEE_HOLIDAYS
              - locationName: EXEC_COMBINED_DATA
                nodeName: V_RATES
              - locationName: EXEC_COMBINED_DATA
                nodeName: V_WORKDAYS
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_TIME_OFF_ENTRY
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE_ALLOCATION
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE_RESOURCE
              - locationName: EXEC_STAGED_REFERENCE
                nodeName: STG_DATE_DATA
            join:
              joinCondition: |
                FROM {{ ref('EXEC_DASH_MAVENLINK','STG_WORKSPACE_ALLOCATION')}} "STG_WORKSPACE_ALLOCATION"
                INNER JOIN {{ ref('EXEC_STAGED_REFERENCE','STG_DATE_DATA')}} "STG_DATE_DATA"
                ON STG_DATE_DATA.CAL_DATE BETWEEN 
                    CASE WHEN STG_WORKSPACE_ALLOCATION.START_DATE >= CURRENT_DATE then STG_WORKSPACE_ALLOCATION.START_DATE
                    ELSE CURRENT_DATE END AND STG_WORKSPACE_ALLOCATION.END_DATE
                LEFT JOIN {{ ref('EXEC_COMBINED_DATA','V_WORKDAYS')}} "V_WORKDAYS"
                ON "V_WORKDAYS".CAL_DATE = "STG_DATE_DATA".CAL_DATE
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK','STG_WORKSPACE_RESOURCE')}} "STG_WORKSPACE_RESOURCE"
                ON "STG_WORKSPACE_RESOURCE".ID = "STG_WORKSPACE_ALLOCATION".WORKSPACE_RESOURCE_ID
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK','STG_TIME_OFF_ENTRY')}} "STG_TIME_OFF_ENTRY"
                ON "STG_TIME_OFF_ENTRY".USER_ID = "STG_WORKSPACE_RESOURCE".USER_ID
                AND "STG_DATE_DATA".CAL_DATE =  "STG_TIME_OFF_ENTRY".REQUESTED_DATE
                LEFT JOIN {{ ref('EXEC_COMBINED_DATA','V_EMPLOYEE_HOLIDAYS')}} "V_EMPLOYEE_HOLIDAYS"
                ON "V_EMPLOYEE_HOLIDAYS"."START_DATE" = "STG_DATE_DATA".CAL_DATE
                AND "V_EMPLOYEE_HOLIDAYS"."USER_ID" = "STG_WORKSPACE_RESOURCE"."USER_ID"
                INNER JOIN {{ ref('EXEC_DASH_MAVENLINK','STG_WORKSPACE')}} "STG_WORKSPACE"
                ON "STG_WORKSPACE".ID = "STG_WORKSPACE_RESOURCE".WORKSPACE_ID
                INNER JOIN {{ ref('EXEC_COMBINED_DATA','V_RATES')}} "V_RATES"
                ON "V_RATES".WORKSPACE_ID = "STG_WORKSPACE".ID AND "V_RATES".ROLE_ID = "STG_WORKSPACE_RESOURCE"."ROLE_ID"


                WHERE
                "STG_WORKSPACE_ALLOCATION".END_DATE >= CASE WHEN "STG_WORKSPACE_ALLOCATION"."START_DATE" >= CURRENT_DATE THEN CURRENT_DATE ELSE "STG_WORKSPACE_ALLOCATION"."START_DATE" END
                AND DAYNAME("STG_DATE_DATA".CAL_DATE) NOT IN ('Sat','Sun') AND "V_RATES"."RN" = 1


                GROUP BY "STG_WORKSPACE".ID,"STG_WORKSPACE_RESOURCE"."USER_ID","STG_WORKSPACE"."CREATOR_ID","STG_WORKSPACE_RESOURCE"."FULL_NAME", "STG_WORKSPACE"."TITLE"
                ,"STG_WORKSPACE"."CLIENT_ROLE_NAME","STG_WORKSPACE"."CUSTOM_GEOGRAPHY","STG_WORKSPACE"."CUSTOM_VERTICAL", "STG_WORKSPACE"."STORIES_ARE_FIXED_FEE_BY_DEFAULT"
                ,"STG_WORKSPACE_ALLOCATION"."END_DATE","STG_WORKSPACE_ALLOCATION"."PERCENTAGE"
                ,"V_RATES"."RATE","STG_WORKSPACE_ALLOCATION"."START_DATE", "STG_DATE_DATA"."YEAR_MONTH", "STG_DATE_DATA"."FISCAL_YEAR_QUARTER", "STG_DATE_DATA"."FISCAL_YEAR"
            name: FCT_FUTURE_FORECAST
            noLinkRefs: []
