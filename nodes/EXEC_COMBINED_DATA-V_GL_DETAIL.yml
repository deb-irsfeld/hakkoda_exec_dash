        sourceMapping:
          - aliases:
              STG_GL_DETAIL: b2dea877-0792-463c-89c8-adb03011e06b
            customSQL:
              customSQL: |-
                {{ stage('Override Create SQL') }}
                	CREATE OR REPLACE VIEW {{ ref('EXEC_COMBINED_DATA', 'V_GL_DETAIL')}} AS (



                with get_max as
                (
                	select projectid,entry_date, to_date(max(auwhencreated)) auwhencreated
                	FROM SAGE_DB.RAW.STG_GL_DETAIL
                    where accountno like '4%' and bookid = 'GlbUSA' --and projectid = '16882694227'--'17135867740' and batch_date = '2024-04-30'
                group by projectid,entry_date
                )
                SELECT 
                 -- BATCHKEY AS BATCHKEY,
                 -- RECORDNO AS RECORDNO,
                 -- _FIVETRAN_SYNCED AS _FIVETRAN_SYNCED,
                 -- TR_TYPE AS TR_TYPE,
                 ACCOUNTTITLE AS ACCOUNTTITLE,
                 ADJ AS ADJ,
                 VENDORNAME AS VENDORNAME,
                 BASECURR AS BASECURR,
                 sum(AMOUNT) AS AMOUNT,
                 PRCLEARED AS PRCLEARED,
                 g.PROJECTID AS PROJECTID,
                 BATCH_DATE AS BATCH_DATE,
                 -- GLENTRYKEY AS GLENTRYKEY,
                 BATCH_STATE AS BATCH_STATE,
                 DOCUMENT AS DOCUMENT,
                 sum(DEBITAMOUNT) AS DEBITAMOUNT,
                 EMPLOYEENAME AS EMPLOYEENAME,
                 CLRDATE AS CLRDATE,
                 ITEMDIMKEY AS ITEMDIMKEY,
                 MODIFIEDBY AS MODIFIEDBY,
                 CUSTOMERDIMKEY AS CUSTOMERDIMKEY,
                 EMPLOYEEID AS EMPLOYEEID,
                 BATCH_NO AS BATCH_NO,
                 TOTALENTERED AS TOTALENTERED,
                 RECORDID AS RECORDID,
                 SYMBOL AS SYMBOL,
                 sum(TRX_AMOUNT) AS TRX_AMOUNT,
                 DOCNUMBER AS DOCNUMBER,
                 OWNERSHIPKEY AS OWNERSHIPKEY,
                 -- LINE_NO AS LINE_NO,
                 -- MODIFIED AS MODIFIED,
                 ITEMID AS ITEMID,
                 ENTRY_STATE AS ENTRY_STATE,
                 CUSTOMERNAME AS CUSTOMERNAME,
                 ACCOUNTNO AS ACCOUNTNO,
                 LOCATIONID AS LOCATIONID,
                 sum(TRX_DEBITAMOUNT) AS TRX_DEBITAMOUNT,
                 DEPARTMENTID AS DEPARTMENTID,
                 MODULEKEY AS MODULEKEY,
                 WHENCREATED AS WHENCREATED,
                 STATE AS STATE,
                 TOTALPAID AS TOTALPAID,
                 BATCH_TITLE AS BATCH_TITLE,
                 RECORDTYPE AS RECORDTYPE,
                 TOTALDUE AS TOTALDUE,
                 -- g.WHENMODIFIED AS WHENMODIFIED,
                 WHENDUE AS WHENDUE,
                 g.AUWHENCREATED AS AUWHENCREATED,
                 VENDORDIMKEY AS VENDORDIMKEY,
                 CUSTOMERID AS CUSTOMERID,
                 VENDORID AS VENDORID,
                 DESCRIPTION AS DESCRIPTION,
                 PROJECTDIMKEY AS PROJECTDIMKEY,
                 STATISTICAL AS STATISTICAL,
                 sum(CREDITAMOUNT) AS CREDITAMOUNT,
                 CUSTENTITY AS CUSTENTITY,
                 BOOKID AS BOOKID,
                 DEPARTMENTTITLE AS DEPARTMENTTITLE,
                 VENDENTITY AS VENDENTITY,
                 CREATEDBY AS CREATEDBY,
                 AUCREATEDBY AS AUCREATEDBY,
                 sum(TRX_CREDITAMOUNT) AS TRX_CREDITAMOUNT,
                 PROJECTNAME AS PROJECTNAME,
                 CURRENCY AS CURRENCY,
                 FINANCIALENTITY AS FINANCIALENTITY,
                 PRCLRDATE AS PRCLRDATE,
                 REFERENCENO AS REFERENCENO,
                 LOCATIONNAME AS LOCATIONNAME,
                 WHENPAID AS WHENPAID,
                 PRDESCRIPTION AS PRDESCRIPTION,
                 g.ENTRY_DATE AS ENTRY_DATE,
                 EMPLOYEEDIMKEY AS EMPLOYEEDIMKEY,
                 ENTRYDESCRIPTION AS ENTRYDESCRIPTION,
                 ITEMNAME AS ITEMNAME,
                 CLEARED AS CLEARED
                 FROM SAGE_DB.RAW.STG_GL_DETAIL g
                 join get_max gm on g.projectid = gm.projectid and g.entry_date = gm.entry_date and to_date(g.auwhencreated) = gm.auwhencreated
                 where g.accountno like '4%' and g.bookid = 'GlbUSA' --and g.projectid = '16882694227'--'17135867740' 
                 --and batch_date = '2024-03-31'
                 group by 
                  -- BATCHKEY ,
                 -- RECORDNO ,
                 -- _FIVETRAN_SYNCED,
                 -- TR_TYPE ,
                 ACCOUNTTITLE,
                 ADJ ,
                 VENDORNAME,
                 BASECURR ,
                 -- sum(AMOUNT) ,
                 PRCLEARED ,
                 g.PROJECTID ,
                 BATCH_DATE ,
                 -- GLENTRYKEY ,
                 BATCH_STATE ,
                 DOCUMENT ,
                 -- DEBITAMOUNT ,
                 EMPLOYEENAME ,
                 CLRDATE ,
                 ITEMDIMKEY,
                 MODIFIEDBY,
                 CUSTOMERDIMKEY ,
                 EMPLOYEEID ,
                 BATCH_NO ,
                 TOTALENTERED ,
                 RECORDID ,
                 SYMBOL ,
                 -- TRX_AMOUNT ,
                 DOCNUMBER ,
                 OWNERSHIPKEY ,
                 -- LINE_NO ,
                 -- MODIFIED ,
                 ITEMID ,
                 ENTRY_STATE ,
                 CUSTOMERNAME,
                 ACCOUNTNO ,
                 LOCATIONID ,
                 -- TRX_DEBITAMOUNT ,
                 DEPARTMENTID ,
                 MODULEKEY ,
                 WHENCREATED ,
                 STATE ,
                 TOTALPAID ,
                 BATCH_TITLE ,
                 RECORDTYPE ,
                 TOTALDUE ,
                 -- g.WHENMODIFIED ,
                 WHENDUE,
                 g.AUWHENCREATED ,
                 VENDORDIMKEY ,
                 CUSTOMERID ,
                 VENDORID ,
                 DESCRIPTION ,
                 PROJECTDIMKEY ,
                 STATISTICAL ,
                 -- CREDITAMOUNT ,
                 CUSTENTITY ,
                 BOOKID ,
                 DEPARTMENTTITLE ,
                 VENDENTITY ,
                 CREATEDBY ,
                 AUCREATEDBY ,
                 --TRX_CREDITAMOUNT,
                 PROJECTNAME ,
                 CURRENCY ,
                 FINANCIALENTITY ,
                 PRCLRDATE ,
                 REFERENCENO ,
                 LOCATIONNAME ,
                 WHENPAID ,
                 PRDESCRIPTION ,
                 g.ENTRY_DATE ,
                 EMPLOYEEDIMKEY ,
                 ENTRYDESCRIPTION ,
                 ITEMNAME ,
                 CLEARED 



                	)
            dependencies:
              - locationName: EXEC_DASH_SAGE
                nodeName: STG_GL_DETAIL
            join:
              joinCondition: |-
