              STG_WORKSPACE_RESOURCE: a1f12038-7275-43ee-b40a-f3e22d4fbda6
            customSQL:
              customSQL: ""
            dependencies:
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_TIME_ENTRY
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE_ALLOCATION
              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE_RESOURCE
            join:
              joinCondition: |-
                FROM {{ ref('EXEC_DASH_MAVENLINK', 'STG_TIME_ENTRY') }} "STG_TIME_ENTRY"
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE') }} "STG_WORKSPACE"
                ON "STG_TIME_ENTRY"."WORKSPACE_ID" = STG_WORKSPACE."ID"
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE_RESOURCE') }} "STG_WORKSPACE_RESOURCE"
                ON "STG_WORKSPACE"."ID" = STG_WORKSPACE_RESOURCE.WORKSPACE_ID AND "STG_TIME_ENTRY"."USER_ID" = "STG_WORKSPACE_RESOURCE"."USER_ID"
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE_ALLOCATION') }} "STG_WORKSPACE_ALLOCATION"
                ON "STG_WORKSPACE_RESOURCE"."ID" = STG_WORKSPACE_ALLOCATION."WORKSPACE_RESOURCE_ID"

                --{{ ref('EXEC_DASH_MAVENLINK','STG_WORKSPACE_ALLOCATION') }} "STG_WORKSPACE_ALLOCATION"
                --JOIN {{ref('EXEC_DASH_MAVENLINK','STG_WORKSPACE_RESOURCE') }} "STG_WORKSPACE_RESOURCE"
                --ON STG_WORKSPACE_RESOURCE.ID = STG_WORKSPACE_ALLOCATION.WORKSPACE_RESOURCE_ID
                --JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE') }} "STG_WORKSPACE"
                --ON "STG_WORKSPACE".ID = STG_WORKSPACE_RESOURCE.WORKSPACE_ID
                --JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_TIME_ENTRY') }} "STG_TIME_ENTRY"
                --ON "STG_TIME_ENTRY"."USER_ID"= "STG_WORKSPACE_RESOURCE"."USER_ID"
                --AND "STG_TIME_ENTRY"."WORKSPACE_ID" = "STG_WORKSPACE_RESOURCE"."WORKSPACE_ID"
                --and "STG_TIME_ENTRY"."DATE_PERFORMED" BETWEEN "STG_WORKSPACE_ALLOCATION"."START_DATE" and "STG_WORKSPACE_ALLOCATION".--"END_DATE"


                WHERE "STG_TIME_ENTRY"."APPROVED" = 'TRUE' 


                GROUP BY
                "STG_TIME_ENTRY"."WORKSPACE_ID","STG_TIME_ENTRY"."USER_ID","STG_WORKSPACE"."CREATOR_ID",
                "STG_WORKSPACE"."TITLE","STG_WORKSPACE"."CLIENT_ROLE_NAME","STG_WORKSPACE_ALLOCATION"."START_DATE",
                 "STG_WORKSPACE_ALLOCATION"."PERCENTAGE","STG_WORKSPACE_ALLOCATION"."END_DATE"
                ,"STG_TIME_ENTRY"."APPROVED", LEFT("STG_TIME_ENTRY"."DATE_PERFORMED",7)
                ,"STG_TIME_ENTRY"."RATE_IN_CENTS", "STG_TIME_ENTRY"."COST_RATE_IN_CENTS"
            name: V_TIME_ENTRY_ACTUAL
            noLinkRefs: []
