              - locationName: EXEC_DASH_MAVENLINK
                nodeName: STG_WORKSPACE_RESOURCE
              - locationName: EXEC_STAGED_REFERENCE
                nodeName: STG_DATE_DATA
            join:
              joinCondition: |-
                FROM {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE_ALLOCATION') }} "STG_WORKSPACE_ALLOCATION"
                INNER JOIN {{ ref('EXEC_STAGED_REFERENCE', 'STG_DATE_DATA') }} "STG_DATE_DATA"
                ON "STG_DATE_DATA"."CAL_DATE" BETWEEN "STG_WORKSPACE_ALLOCATION"."START_DATE" AND 
                CASE WHEN "STG_WORKSPACE_ALLOCATION"."END_DATE" > CURRENT_DATE THEN CURRENT_DATE ELSE 
                "STG_WORKSPACE_ALLOCATION"."END_DATE" END
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE_RESOURCE') }} "STG_WORKSPACE_RESOURCE"
                ON "STG_WORKSPACE_RESOURCE"."ID" = "STG_WORKSPACE_ALLOCATION"."WORKSPACE_RESOURCE_ID"
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_TIME_OFF_ENTRY') }} "STG_TIME_OFF_ENTRY"
                ON "STG_TIME_OFF_ENTRY"."USER_ID" = "STG_WORKSPACE_RESOURCE"."USER_ID" AND "STG_DATE_DATA"."CAL_DATE" = "STG_TIME_OFF_ENTRY"."REQUESTED_DATE"
                LEFT JOIN {{ ref('EXEC_COMBINED_DATA', 'V_EMPLOYEE_HOLIDAYS') }} "V_EMPLOYEE_HOLIDAYS"
                ON "V_EMPLOYEE_HOLIDAYS"."START_DATE" = "STG_DATE_DATA"."CAL_DATE" AND "V_EMPLOYEE_HOLIDAYS"."USER_ID" = "STG_WORKSPACE_RESOURCE"."USER_ID"
                LEFT JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_WORKSPACE') }} "STG_WORKSPACE"
                ON "STG_WORKSPACE".ID = "STG_WORKSPACE_RESOURCE"."WORKSPACE_ID"
                INNER JOIN {{ ref('EXEC_DASH_MAVENLINK', 'STG_TIME_ENTRY') }} "STG_TIME_ENTRY"
                ON "STG_TIME_ENTRY"."USER_ID" = "STG_WORKSPACE_RESOURCE"."USER_ID" AND "STG_TIME_ENTRY"."WORKSPACE_ID" = "STG_WORKSPACE_RESOURCE"."WORKSPACE_ID" AND "STG_TIME_ENTRY"."DATE_PERFORMED" BETWEEN "STG_WORKSPACE_ALLOCATION"."START_DATE" AND "STG_WORKSPACE_ALLOCATION"."END_DATE"

                WHERE "STG_WORKSPACE_ALLOCATION"."START_DATE" <= CURRENT_DATE AND DAYNAME("STG_DATE_DATA"."CAL_DATE") NOT IN ('Sat','Sun') 
                and "STG_TIME_ENTRY"."APPROVED" = TRUE



                         group by   STG_WORKSPACE_ALLOCATION.start_date, STG_WORKSPACE_ALLOCATION.end_date, STG_WORKSPACE_ALLOCATION.percentage, STG_WORKSPACE_RESOURCE.full_name, STG_WORKSPACE.title, STG_WORKSPACE.client_role_name, STG_WORKSPACE.custom_vertical, STG_WORKSPACE.custom_geography, STG_WORKSPACE_RESOURCE.user_id, STG_WORKSPACE_RESOURCE.workspace_id, STG_TIME_ENTRY.rate_in_cents, STG_WORKSPACE.stories_are_fixed_fee_by_default, STG_DATE_DATA.year_month, STG_DATE_DATA.fiscal_year_quarter, STG_DATE_DATA.fiscal_year, 
